app = "dungeon-crawler-api"
primary_region = "lax"

[build]
dockerfile = "apps/api/Dockerfile"

[env]
PORT = "3000"
EMBEDDED_REDIS = "true"
REDIS_URL = "redis://127.0.0.1:6379"

[http_service]
auto_start_machines = true
auto_stop_machines = "off"
force_https = true
internal_port = 3000
min_machines_running = 1

  [http_service.concurrency]
  hard_limit = 1000
  soft_limit = 800
  type = "connections"

  # flyctl drops unknown keys, so only `fly config show` proves an edit here landed.
  [[http_service.checks]]
  grace_period = "40s"
  interval = "15s"
  method = "GET"
  path = "/health/dependencies"
  timeout = "5s"

[[mounts]]
source = "redis_data"
destination = "/data"

[[vm]]
cpus = 1
memory = "256mb"
size = "shared-cpu-1x"
