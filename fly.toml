# Gameplay API. Redis is a separate app (fly.redis.toml) so the command journal
# outlives an API deploy.
app = "dungeon-crawler-api"
primary_region = "lax"

[build]
dockerfile = "apps/api/Dockerfile"

[env]
PORT = "3000"

[http_service]
auto_start_machines = true
auto_stop_machines = "off"
force_https = true
internal_port = 3000
min_machines_running = 1

  [http_service.concurrency]
  hard_limit = 1000
  soft_limit = 800
  type = "connections"

  # Liveness alone would keep routing traffic to a machine that has lost MongoDB
  # or Redis. Confirm with `fly config show`: validate ignores unknown keys.
  [[http_service.checks]]
  grace_period = "40s"
  interval = "15s"
  method = "GET"
  path = "/health/dependencies"
  timeout = "5s"

[[vm]]
cpus = 1
memory = "256mb"
size = "shared-cpu-1x"
