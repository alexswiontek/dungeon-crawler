# Command journal for dungeon-crawler-api. No service block, so this app is
# reachable only over the private network.
app = "dungeon-crawler-redis"
primary_region = "lax"

[build]
dockerfile = "apps/redis/Dockerfile"

[checks.redis]
type = "tcp"
port = 6379
interval = "15s"
timeout = "2s"

[[mounts]]
source = "redis_data"
destination = "/data"

[[vm]]
cpus = 1
memory = "256mb"
size = "shared-cpu-1x"
